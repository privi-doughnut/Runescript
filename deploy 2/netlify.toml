[build]
  command = "npm run build"
  publish = "dist"

# ── SPA Routing ────────────────────────────────────────────────────────────
# All routes serve index.html — React Router handles routing client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security Headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets ────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
